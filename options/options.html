<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="options.css">
  <title>斗鱼直播通知 - 设置</title>
</head>
<body>
  <div class="container">
    <header class="page-head">
      <div class="brand">
        <h1>斗鱼直播通知</h1>
        <p class="subtitle">监控斗鱼与 B 站直播间 · 开播即刻提醒</p>
      </div>
      <div class="head-meter" id="headMeter" data-lit="0" aria-hidden="true">
        <span class="meter-bar"></span>
        <span class="meter-bar"></span>
        <span class="meter-bar"></span>
        <span class="meter-bar"></span>
      </div>
    </header>

    <h2 class="group-title">房间号管理</h2>
    <section class="card">
      <div class="input-row">
        <select id="roomPlatform">
          <option value="douyu">斗鱼</option>
          <option value="bilibili">B站</option>
        </select>
        <input type="text" id="roomIdInput" placeholder="输入房间号，如 12345" autocomplete="off">
        <button id="addRoomBtn" class="btn primary">添加</button>
      </div>
      <div id="addStatus" class="status hidden"></div>
      <div id="roomList" class="room-list"></div>
      <div id="emptyRooms" class="empty-hint">尚未添加房间，请输入房间号并点击添加</div>
      <div class="cell-divider"></div>
      <button id="refreshStatusBtn" class="cell-btn">刷新全部状态</button>
    </section>
    <p class="group-hint">添加要监控的直播间房间号</p>

    <h2 class="group-title">刷新设置</h2>
    <section class="card">
      <div class="setting-row">
        <label for="refreshInterval">轮询间隔</label>
        <input type="number" id="refreshInterval" min="60" value="60" step="30">
        <span class="unit">秒（最小 60）</span>
      </div>
      <div class="cell-divider"></div>
      <button id="saveSettingsBtn" class="cell-btn">保存设置</button>
      <div id="settingsStatus" class="status hidden"></div>
    </section>

    <h2 class="group-title">通知设置</h2>
    <section class="card">
      <label class="toggle-row">
        <input type="checkbox" id="notificationsEnabled" checked>
        <span>新开播时发送桌面通知</span>
      </label>
    </section>

    <h2 class="group-title">观众数设置</h2>
    <section class="card">
      <label class="toggle-row">
        <input type="checkbox" id="fetchViewerCount" checked>
        <span>获取房间观众数</span>
      </label>
    </section>
    <p class="group-hint">斗鱼显示贵宾数，B站显示高能榜在线数（每 10 分钟更新一次）</p>
  </div>

  <script src="options.js"></script>
</body>
</html>
