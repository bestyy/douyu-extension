<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="options.css">
  <title>直播通知 - 设置</title>
</head>

<body>
  <div class="container">
    <header class="page-head">
      <div class="brand">
        <h1>直播通知</h1>
        <p class="subtitle">监控斗鱼与 B 站直播间 · 开播即刻提醒</p>
      </div>
      <div class="head-meter" id="headMeter" data-lit="0" aria-hidden="true">
        <span class="meter-bar"></span>
        <span class="meter-bar"></span>
        <span class="meter-bar"></span>
        <span class="meter-bar"></span>
      </div>
    </header>

    <h2 class="group-title">房间号管理</h2>
    <section class="card">
      <div class="input-row">
        <select id="roomPlatform">
          <option value="douyu">斗鱼</option>
          <option value="bilibili">B站</option>
        </select>
        <input type="text" id="roomIdInput" placeholder="输入房间号，如 12345" autocomplete="off">
        <button id="addRoomBtn" class="btn primary">添加</button>
      </div>
      <div id="addStatus" class="status hidden"></div>
      <div id="roomList" class="room-list"></div>
      <div id="emptyRooms" class="empty-hint">尚未添加房间，请输入房间号并点击添加</div>
      <div class="cell-divider"></div>
      <button id="refreshStatusBtn" class="cell-btn">刷新全部状态</button>
    </section>
    <p class="group-hint">添加要监控的房间号；拖动行首手柄可调整顺序。每个房间的开关与参数（开播通知、检测词、提醒阈值）在行内「通知设置」里单独配置，弹幕检测与观众数提醒斗鱼 / B站 均支持</p>

    <h2 class="group-title">通知总开关</h2>
    <section class="card">
      <label class="toggle-row">
        <span class="row-text">
          <span class="row-title">开播通知</span>
          <span class="row-desc">新开播时发送桌面通知</span>
        </span>
        <input type="checkbox" id="notificationsEnabled" checked>
      </label>
      <div class="cell-divider"></div>
      <label class="toggle-row">
        <span class="row-text">
          <span class="row-title">弹幕检测</span>
          <span class="row-desc">开播时盯弹幕，窗口内命中检测词达到阈值就通知</span>
        </span>
        <input type="checkbox" id="danmakuWatchEnabled" checked>
      </label>
      <div class="cell-divider"></div>
      <label class="toggle-row">
        <span class="row-text">
          <span class="row-title">观众数提醒</span>
          <span class="row-desc">贵宾数 / 高能榜越过该房阈值时通知</span>
        </span>
        <input type="checkbox" id="viewerAlertEnabled" checked>
      </label>
    </section>
    <p class="group-hint">三项都是总开关，关闭后所有房间都不发对应通知；各房已配的检测词与阈值保留，重新打开即恢复。单个房间的开关与参数在房间行的「通知设置」里（关闭开播通知不影响另外两项）</p>

    <h2 class="group-title">刷新与采样</h2>
    <section class="card">
      <div class="setting-row">
        <label class="row-text" for="refreshInterval">
          <span class="row-title">轮询间隔</span>
          <span class="row-desc">开播状态的刷新频率，最小 60 秒</span>
        </label>
        <input type="number" id="refreshInterval" min="60" value="60" step="30">
        <span class="unit">秒</span>
        <span class="saved-tip hidden" id="intervalSaved">已保存</span>
      </div>
      <div class="cell-divider"></div>
      <label class="toggle-row">
        <span class="row-text">
          <span class="row-title">斗鱼 · 贵宾数</span>
          <span class="row-desc">通过弹幕采样获取贵宾数</span>
        </span>
        <input type="checkbox" id="fetchDouyuViewerCount" checked>
      </label>
      <div class="cell-divider"></div>
      <label class="toggle-row">
        <span class="row-text">
          <span class="row-title">B站 · 高能榜在线数</span>
          <span class="row-desc">通过弹幕采样获取高能榜在线数</span>
        </span>
        <input type="checkbox" id="fetchBilibiliViewerCount" checked>
      </label>
    </section>
    <p class="group-hint">两项观众数开关独立控制对应平台的采样（每 10 分钟一次）；关闭后拿不到数值，对应平台的观众数提醒不会触发</p>
  </div>

  <script src="../lib/danmaku-watch.js"></script>
  <script src="../lib/viewer-alert.js"></script>
  <script src="../lib/room-store.js"></script>
  <script src="options.js"></script>
</body>

</html>
