<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线主播监控</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>在线主播</h1>
      <div class="monitor" id="monitor" data-lit="0">
        <div class="meter" aria-hidden="true">
          <span class="meter-bar"></span>
          <span class="meter-bar"></span>
          <span class="meter-bar"></span>
          <span class="meter-bar"></span>
        </div>
        <div class="count">
          <span id="onlineCount">0</span>
          <span class="count-label">在线</span>
        </div>
      </div>
    </header>

    <div id="loading" class="state-msg">
      <span class="spinner" aria-hidden="true"></span>
      <p>正在获取直播间状态</p>
    </div>

    <div id="noRoom" class="state-msg hidden">
      <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="13" rx="2.5"/>
        <path d="M8.5 21h7M12 18v3"/>
      </svg>
      <p>未配置监控房间</p>
      <p class="sub" id="noRoomSub">请前往 <a href="#" id="openOptions">设置页</a> 添加房间号</p>
    </div>

    <div id="emptyState" class="state-msg hidden">
      <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M5 17v3M11 13v7M17 9v11"/>
      </svg>
      <p>当前没有主播开播</p>
      <p class="sub">开播后会自动出现在这里</p>
    </div>

    <div id="errorState" class="state-msg hidden">
      <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7.5V13"/>
        <path d="M12 16.5v.01"/>
      </svg>
      <p>网络异常</p>
      <p class="sub">请稍后重试</p>
    </div>

    <div id="streamerList" class="hidden"></div>

    <div id="optionsBar">
      <label id="currentTabLabel">
        <input type="checkbox" id="currentTabCheck">
        <span>当前标签页跳转</span>
      </label>
    </div>

    <footer>
      <button id="refreshBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.6 8a5.6 5.6 0 1 1-1.7-4"/>
          <path d="M13.6 2.4v2.8h-2.8"/>
        </svg>
        刷新
      </button>
      <button id="settingsBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 4.5h7.5M12 4.5H14M2 11.5h2M6.5 11.5H14"/>
          <circle cx="10" cy="4.5" r="1.7"/>
          <circle cx="4.5" cy="11.5" r="1.7"/>
        </svg>
        设置
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
