<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🔴 斗鱼关注</h1>
      <span id="onlineCount" class="badge">0</span>
    </header>

    <div id="loading" class="state-msg">加载中...</div>
    <div id="noRoom" class="state-msg hidden">
      <p>⚠️ 未配置监控房间</p>
      <p class="sub" id="noRoomSub">请前往 <a href="#" id="openOptions">设置页</a> 添加房间号</p>
    </div>
    <div id="emptyState" class="state-msg hidden">
      <p>☕ 当前没有主播开播</p>
    </div>
    <div id="errorState" class="state-msg hidden">
      <p>❌ 网络异常</p>
      <p class="sub">请稍后重试</p>
    </div>

    <div id="streamerList" class="hidden"></div>

    <div id="optionsBar">
      <label id="currentTabLabel">
        <input type="checkbox" id="currentTabCheck">
        当前标签页跳转
      </label>
    </div>

    <footer>
      <button id="refreshBtn">🔄 刷新</button>
      <button id="settingsBtn">⚙️ 设置</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
